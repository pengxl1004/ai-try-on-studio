        const Icon = React.memo(({ name, size = 24, className = "" }) => {

        // ========== 工具函数 ==========
        const generateId = () => `${Date.now()}_${Math.random().toString(36).substring(2, 11)}`;

        const sanitizeSubfolder = (folder) => {
            if (!folder) return '';
            return folder.replace(/\.\./g, '').replace(/^\/+/, '').replace(/[<>:"|?*]/g, '').trim();
        };

        const getBlobFromUrl = async (url) => {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Failed to fetch blob: ${response.status}`);
            return response.blob();
        };

        const convertToJpgDataUrl = (imgUrl) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.naturalWidth;
                        canvas.height = img.naturalHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0);
                        resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
                    } catch (e) { resolve(null); }
                };
                img.onerror = () => resolve(null);
                img.src = imgUrl;
            });
        };

        const readFileAsDataURL = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(file);
        });

        const blobToDataURL = (blob) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(blob);
        });

        const compressImageForPreview = (imgUrl, maxSize = 768, quality = 0.7) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        const maxEdge = Math.max(img.naturalWidth, img.naturalHeight);
                        const scale = Math.min(1, maxSize / maxEdge);
                        const width = Math.max(1, Math.round(img.naturalWidth * scale));
                        const height = Math.max(1, Math.round(img.naturalHeight * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    } catch (e) {
                        resolve(null);
                    }
                };
                img.onerror = () => resolve(null);
                img.src = imgUrl;
            });
        };

        const openHandleDB = () => new Promise((resolve, reject) => {
            const request = indexedDB.open('tryon_handles_db', 2);
            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains('handles')) {
                    db.createObjectStore('handles');
                }
                if (!db.objectStoreNames.contains('images')) {
                    db.createObjectStore('images');
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });

        const saveHandleToDB = async (key, handle) => {
            try {
                const db = await openHandleDB();
                const tx = db.transaction('handles', 'readwrite');
                tx.objectStore('handles').put(handle, key);
                return new Promise(resolve => {
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) { return false; }
        };

        const loadHandleFromDB = async (key) => {
            try {
                const db = await openHandleDB();
                const tx = db.transaction('handles', 'readonly');
                const req = tx.objectStore('handles').get(key);
                return new Promise(resolve => {
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => resolve(null);
                });
            } catch (e) { return null; }
        };

        const deleteHandleFromDB = async (key) => {
            try {
                const db = await openHandleDB();
                const tx = db.transaction('handles', 'readwrite');
                tx.objectStore('handles').delete(key);
                return new Promise(resolve => {
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) { return false; }
        };

        const saveImageToDB = async (key, dataUrl) => {
            try {
                const db = await openHandleDB();

                tx.objectStore('images').put(dataUrl, key);
                return new Promise(resolve => {
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) { return false; }
        };

        const loadImageFromDB = async (key) => {
            try {
                const db = await openHandleDB();
                const tx = db.transaction('images', 'readonly');

        const saveGalleryMeta = (items) => {
            try {

            } catch (e) { /* ignore */ }
        };

        const deepSearchForUrl = (obj, depth = 0, visited = new WeakSet()) => {
            if (depth > 5 || !obj || typeof obj !== 'object') return null;
            if (visited.has(obj)) return null;
            visited.add(obj);
            const urlFields = ['url', 'image_url', 'imageUrl', 'image', 'src'];
            for (const field of urlFields) {
                if (obj[field] && typeof obj[field] === 'string' && obj[field].startsWith('http')) {
                    return obj[field];
                }
            }
            if (Array.isArray(obj) && obj.length > 0) {
                const result = deepSearchForUrl(obj[0], depth + 1, visited);
                if (result) return result;
            }
            for (const key in obj) {
                if (obj.hasOwnProperty(key) && !urlFields.includes(key)) {
                    const result = deepSearchForUrl(obj[key], depth + 1, visited);
                    if (result) return result;
                }
            }
            return null;
        };

        // ========== 信号量类 ==========
        class Semaphore {
            constructor(max) {
                this.max = max;
                this.count = 0;
                this.queue = [];
            }
            acquire() {
                return new Promise(resolve => {
                    if (this.count < this.max) { this.count++; resolve(); }
                    else { this.queue.push(resolve); }
                });
            }
            release() {
                this.count--;
                if (this.queue.length > 0) { this.count++; this.queue.shift()(); }
            }
        }

        // ========== Task Reducer ==========
        const taskReducer = (state, action) => {
            switch (action.type) {
                case 'SET_TASKS': return action.tasks;
                case 'UPDATE_TASK': return state.map(t => t.id === action.id ? { ...t, ...action.updates } : t);
                case 'CLEAR_TASKS': return [];
                default: return state;
            }
        };

                                        <input type="checkbox" checked={settings.previewCompress}

                                                    className="w-full bg-white hover:bg-yellow-50 border border-zinc-200 px-3 py-2 text-sm font-bold transition-colors text-left flex items-center justify-between group shadow-sm active:shadow-none active:translate-x-[2px] active:translate-y-[2px]"
                                                >
                                                    <span className="truncate group-hover:underline">
                                                        {localDirHandle ? localDirHandle.name : 'Select Output Folder...'}
                                                    </span>
                                                    <Icon name="upload" size={14} />
                                                </button>
                                                {localDirHandle && localDirPermission !== 'granted' && (
                                                    <button onClick={ensureLocalDirPermission} className="text-xs font-bold text-primary-600 hover:text-primary-500 underline bg-white border border-zinc-200 px-2 py-1">
                                                        Grant Write Permission
                                                    </button>
                                                )}
                                            </div>

                                        {settings.saveMode === 'server' && (
                                            <div className="space-y-2">
                                                <SettingsStyledInput
                                                    value={settings.serverUrl}
                                                    onChange={e => setSettings(s => ({ ...s, serverUrl: e.target.value }))}
                                                    placeholder="Server URL (e.g. http://localhost:3000)"
                                                />
                                                <button onClick={testServerConnection} className="text-xs font-bold text-zinc-600 hover:text-zinc-800 underline">
                                                    Test Connection
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        });

        // ========== 主应用组件 ==========
        const App = () => {
            // 图片状态
            const [groups, setGroups] = useState(() => ([
                { id: generateId(), name: '分组1', clothingImages: [], modelImages: [], collapsed: false },
            ]));

            // 任务状态
            const [tasks, dispatch] = useReducer(taskReducer, []);

            // 设置状态 - 安全加载
            const [settings, setSettings] = useState(() => {
                try {
                    const saved = localStorage.getItem('tryon_settings');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (typeof parsed === 'object' && parsed !== null) {
                            return { ...DEFAULT_SETTINGS, ...parsed };
                        }
                    }
                } catch (e) {
                    localStorage.removeItem('tryon_settings');
                }
                return DEFAULT_SETTINGS;
            });

            // UI 状态
            const [isRunning, setIsRunning] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [serverStatus, setServerStatus] = useState('unknown');
            const [localDirHandle, setLocalDirHandle] = useState(null);
            const [localDirPermission, setLocalDirPermission] = useState('unknown'); // unknown | granted | denied
            const [previewModalUrl, setPreviewModalUrl] = useState('');
            const [dragOverId, setDragOverId] = useState('');
            const [dragOverType, setDragOverType] = useState('');
            const [activeTab, setActiveTab] = useState('main'); // main | gallery
            const [galleryItems, setGalleryItems] = useState([]);
            const [gallerySelected, setGallerySelected] = useState(() => new Set());
            const [cropState, setCropState] = useState({ open: false, type: '', id: '', src: '', groupId: '' });
            const [cropRect, setCropRect] = useState(null);
            const [cropAspect, setCropAspect] = useState('free'); // free | 1:1 | 3:4 | 4:3
            const [cropImageSize, setCropImageSize] = useState({ w: 0, h: 0 });
            const cropImageRef = useRef(null);
            const cropOverlayRef = useRef(null);
            const isCroppingRef = useRef(false);
            const cropStartRef = useRef({ x: 0, y: 0 });
            const cropDragModeRef = useRef('');
            const cropRectStartRef = useRef(null);
            const cropHandleSize = 10;
            const prevImageIdsRef = useRef({ clothing: new Set(), model: new Set() });
            const prevGroupIdsRef = useRef(new Set());

            useEffect(() => {
                if (!cropState.open) return;
                const updateSize = () => {
                    if (cropImageRef.current) {
                        setCropImageSize({
                            w: cropImageRef.current.clientWidth,
                            h: cropImageRef.current.clientHeight,
                        });
                    }
                };
                const id = requestAnimationFrame(updateSize);
                window.addEventListener('resize', updateSize);
                return () => {
                    cancelAnimationFrame(id);
                    window.removeEventListener('resize', updateSize);
                };
            }, [cropState.open, cropState.src]);

            const getOverlayPoint = useCallback((e) => {
                const overlay = cropOverlayRef.current;
                if (!overlay) return { x: 0, y: 0 };
                const rect = overlay.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top,
                };
            }, []);

            const clampRectToImage = useCallback((rect) => {
                const maxW = cropImageSize.w;
                const maxH = cropImageSize.h;
                const x = Math.min(Math.max(rect.x, 0), maxW);
                const y = Math.min(Math.max(rect.y, 0), maxH);
                const w = Math.min(Math.max(rect.w, 1), maxW - x);
                const h = Math.min(Math.max(rect.h, 1), maxH - y);
                return { x, y, w, h };
            }, [cropImageSize]);

            const applyAspect = useCallback((rect, anchor = 'se') => {
                if (cropAspect === 'free') return rect;
                const ratio = cropAspect === '1:1' ? 1 : cropAspect === '3:4' ? 3 / 4 : 4 / 3;
                let { x, y, w, h } = rect;
                if (anchor === 'se') {
                    h = w / ratio;
                } else if (anchor === 'sw') {
                    h = w / ratio;
                    x = x - (w - rect.w);
                } else if (anchor === 'ne') {
                    h = w / ratio;
                    y = y - (h - rect.h);
                } else if (anchor === 'nw') {
                    h = w / ratio;
                    x = x - (w - rect.w);
                    y = y - (h - rect.h);
                }
                return { x, y, w, h };
            }, [cropAspect]);

            const handleCropPointerDown = useCallback((e) => {
                if (!cropOverlayRef.current) return;
                if (cropImageSize.w === 0 || cropImageSize.h === 0) return;
                const { x, y } = getOverlayPoint(e);
                if (x < 0 || y < 0 || x > cropImageSize.w || y > cropImageSize.h) return;
                const hs = cropHandleSize;
                let mode = 'new';
                if (cropRect) {
                    const inRect = x >= cropRect.x && x <= cropRect.x + cropRect.w && y >= cropRect.y && y <= cropRect.y + cropRect.h;
                    const near = (cx, cy) => Math.abs(x - cx) <= hs && Math.abs(y - cy) <= hs;
                    if (near(cropRect.x, cropRect.y)) mode = 'nw';
                    else if (near(cropRect.x + cropRect.w, cropRect.y)) mode = 'ne';
                    else if (near(cropRect.x, cropRect.y + cropRect.h)) mode = 'sw';
                    else if (near(cropRect.x + cropRect.w, cropRect.y + cropRect.h)) mode = 'se';
                    else if (inRect) mode = 'move';
                }
                cropDragModeRef.current = mode;
                isCroppingRef.current = true;
                cropStartRef.current = { x, y };
                cropRectStartRef.current = cropRect ? { ...cropRect } : null;
                if (mode === 'new') {
                    setCropRect({ x, y, w: 1, h: 1 });
                }
                if (cropOverlayRef.current.setPointerCapture) {
                    cropOverlayRef.current.setPointerCapture(e.pointerId);
                }
            }, [cropRect, cropImageSize, getOverlayPoint]);

            const handleCropPointerMove = useCallback((e) => {
                if (!isCroppingRef.current) return;
                const { x, y } = getOverlayPoint(e);
                const clampX = Math.min(Math.max(x, 0), cropImageSize.w);
                const clampY = Math.min(Math.max(y, 0), cropImageSize.h);
                const start = cropStartRef.current;
                const mode = cropDragModeRef.current;

                if (mode === 'new') {
                    const rx = Math.min(start.x, clampX);
                    const ry = Math.min(start.y, clampY);
                    const rw = Math.abs(clampX - start.x);
                    const rh = Math.abs(clampY - start.y);
                    setCropRect(clampRectToImage(applyAspect({ x: rx, y: ry, w: rw, h: rh }, 'se')));
                    return;
                }

                if (!cropRectStartRef.current) return;
                const base = cropRectStartRef.current;
                if (mode === 'move') {
                    const dx = clampX - start.x;
                    const dy = clampY - start.y;
                    setCropRect(clampRectToImage({ x: base.x + dx, y: base.y + dy, w: base.w, h: base.h }));
                    return;
                }

                let next = { ...base };
                if (mode === 'se') {
                    next.w = Math.max(1, clampX - base.x);
                    next.h = Math.max(1, clampY - base.y);
                    next = applyAspect(next, 'se');
                } else if (mode === 'sw') {
                    next.w = Math.max(1, base.x + base.w - clampX);
                    next.h = Math.max(1, clampY - base.y);
                    next.x = base.x + base.w - next.w;
                    next = applyAspect(next, 'sw');
                } else if (mode === 'ne') {
                    next.w = Math.max(1, clampX - base.x);
                    next.h = Math.max(1, base.y + base.h - clampY);
                    next.y = base.y + base.h - next.h;
                    next = applyAspect(next, 'ne');
                } else if (mode === 'nw') {
                    next.w = Math.max(1, base.x + base.w - clampX);
                    next.h = Math.max(1, base.y + base.h - clampY);
                    next.x = base.x + base.w - next.w;
                    next.y = base.y + base.h - next.h;
                    next = applyAspect(next, 'nw');
                }
                setCropRect(clampRectToImage(next));
            }, [applyAspect, clampRectToImage, cropImageSize, getOverlayPoint]);

            const handleCropPointerUp = useCallback((e) => {
                isCroppingRef.current = false;
                if (cropOverlayRef.current && cropOverlayRef.current.releasePointerCapture) {
                    cropOverlayRef.current.releasePointerCapture(e.pointerId);
                }
                if (!cropRect || cropRect.w < 8 || cropRect.h < 8) {
                    const minSize = 120;
                    const cx = Math.min(Math.max(cropStartRef.current.x - minSize / 2, 0), cropImageSize.w - minSize);
                    const cy = Math.min(Math.max(cropStartRef.current.y - minSize / 2, 0), cropImageSize.h - minSize);
                    setCropRect(clampRectToImage({ x: cx, y: cy, w: minSize, h: minSize }));
                }
                cropDragModeRef.current = 'move';
            }, [cropImageSize, cropRect, clampRectToImage]);

            // Refs
            const semaphoreRef = useRef(null);
            const abortControllerRef = useRef(null);

            // 保存设置
            useEffect(() => {
                try {
                    localStorage.setItem('tryon_settings', JSON.stringify(settings));
                } catch (e) { /* ignore */ }
            }, [settings]);

            // 组件卸载时清理资源
            useEffect(() => {
                return () => {
                    if (abortControllerRef.current) {
                        abortControllerRef.current.abort();
                    }
                };
            }, []);

            useEffect(() => {
                loadHandleFromDB('localDir').then(handle => {
                    if (handle) setLocalDirHandle(handle);
                });
            }, []);

            useEffect(() => {
                if (localDirHandle) {
                    saveHandleToDB('localDir', localDirHandle);
                } else {
                    deleteHandleFromDB('localDir');
                }
            }, [localDirHandle]);

            useEffect(() => {
                const loadGallery = async () => {
                    try {
                        const saved = localStorage.getItem('tryon_gallery');
                        if (!saved) return;
                        const parsed = JSON.parse(saved);
                        if (!Array.isArray(parsed)) return;
                        const items = await Promise.all(parsed.map(async (item) => {
                            const dataUrl = item?.dbKey ? await loadImageFromDB(item.dbKey) : null;
                            if (!dataUrl) return null;
                            const clothingUrl = item?.clothingDbKey ? await loadImageFromDB(item.clothingDbKey) : null;
                            const modelUrl = item?.modelDbKey ? await loadImageFromDB(item.modelDbKey) : null;
                            return { ...item, url: dataUrl, clothingUrl, modelUrl };
                        }));
                        setGalleryItems(items.filter(Boolean));
                    } catch (e) { /* ignore */ }
                };
                loadGallery();
            }, []);

            useEffect(() => {
                const loadImages = async () => {
                    try {
                        const saved = localStorage.getItem('tryon_groups');
                        if (!saved) return;
                        const parsed = JSON.parse(saved);
                        if (!Array.isArray(parsed)) return;
                        const loadList = async (list) => {
                            if (!Array.isArray(list)) return [];
                            const items = await Promise.all(list.map(async (item) => {
                                const dbKey = item?.dbKey || item?.id;
                                const dataUrl = dbKey ? await loadImageFromDB(dbKey) : null;
                                if (!dataUrl) return null;
                                return { id: item.id || dbKey, name: item.name || 'image', url: dataUrl };
                            }));
                            return items.filter(Boolean);
                        };
                        const nextGroups = await Promise.all(parsed.map(async (g, idx) => ({
                            id: g.id || generateId(),
                            name: g.name || `分组${idx + 1}`,
                            clothingImages: await loadList(g.clothingImages || []),
                            modelImages: await loadList(g.modelImages || []),
                            collapsed: !!g.collapsed,
                        })));
                        if (nextGroups.length > 0) setGroups(nextGroups);
                    } catch (e) { /* ignore */ }
                };
                loadImages();
            }, []);

            useEffect(() => {
                try {
                    const persist = async () => {
                        const allClothing = [];
                        const allModel = [];
                        groups.forEach(g => {
                            allClothing.push(...g.clothingImages);
                            allModel.push(...g.modelImages);
                        });
                        await Promise.all(allClothing.map(img => img.url?.startsWith('data:') ? saveImageToDB(img.id, img.url) : Promise.resolve()));
                        await Promise.all(allModel.map(img => img.url?.startsWith('data:') ? saveImageToDB(img.id, img.url) : Promise.resolve()));

                        localStorage.setItem('tryon_groups', JSON.stringify(groups.map(g => ({
                            id: g.id,
                            name: g.name,
                            collapsed: !!g.collapsed,
                            clothingImages: g.clothingImages.map(i => ({ id: i.id, name: i.name, dbKey: i.id })),
                            modelImages: g.modelImages.map(i => ({ id: i.id, name: i.name, dbKey: i.id })),
                        }))));

                        const currentClothing = new Set(allClothing.map(i => i.id));
                        const currentModel = new Set(allModel.map(i => i.id));
                        for (const id of prevImageIdsRef.current.clothing) {
                            if (!currentClothing.has(id)) await deleteImageFromDB(id);
                        }
                        for (const id of prevImageIdsRef.current.model) {
                            if (!currentModel.has(id)) await deleteImageFromDB(id);
                        }
                        prevImageIdsRef.current = { clothing: currentClothing, model: currentModel };

                        const currentGroupIds = new Set(groups.map(g => g.id));
                        prevGroupIdsRef.current = currentGroupIds;
                    };
                    persist();
                } catch (e) { /* ignore */ }
            }, [groups]);

            useEffect(() => {
                saveGalleryMeta(galleryItems);
            }, [galleryItems]);

            useEffect(() => {
                const checkPermission = async () => {
                    if (!localDirHandle || !localDirHandle.queryPermission) return;
                    try {
                        const perm = await localDirHandle.queryPermission({ mode: 'readwrite' });
                        setLocalDirPermission(perm === 'granted' ? 'granted' : 'denied');
                    } catch (e) { setLocalDirPermission('denied'); }
                };
                checkPermission();
            }, [localDirHandle]);

            const ensureLocalDirPermission = useCallback(async () => {
                if (!localDirHandle) return false;
                try {
                    if (localDirHandle.queryPermission) {
                        let perm = await localDirHandle.queryPermission({ mode: 'readwrite' });
                        if (perm !== 'granted' && localDirHandle.requestPermission) {
                            perm = await localDirHandle.requestPermission({ mode: 'readwrite' });
                        }
                        setLocalDirPermission(perm === 'granted' ? 'granted' : 'denied');
                        return perm === 'granted';
                    }
                } catch (e) { /* ignore */ }
                return false;
            }, [localDirHandle]);

            // ========== 文件处理函数 ==========
            const handleFileDrop = useCallback((e, type, groupId) => {
                e.preventDefault();
                e.currentTarget.classList.remove('dragover');
                const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
                if (files.length === 0) return;
                Promise.all(files.map(async (file) => ({
                    id: generateId(),
                    url: await readFileAsDataURL(file),
                    name: file.name,
                }))).then((imageUrls) => {
                    setGroups(prev => prev.map(g => {
                        if (g.id !== groupId) return g;
                        if (type === 'clothing') return { ...g, clothingImages: [...g.clothingImages, ...imageUrls] };
                        return { ...g, modelImages: [...g.modelImages, ...imageUrls] };
                    }));
                });
            }, []);

            const handleFileSelect = useCallback((e, type, groupId) => {
                const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
                if (files.length === 0) return;
                Promise.all(files.map(async (file) => ({
                    id: generateId(),
                    url: await readFileAsDataURL(file),
                    name: file.name,
                }))).then((imageUrls) => {
                    setGroups(prev => prev.map(g => {
                        if (g.id !== groupId) return g;
                        if (type === 'clothing') return { ...g, clothingImages: [...g.clothingImages, ...imageUrls] };
                        return { ...g, modelImages: [...g.modelImages, ...imageUrls] };
                    }));
                });
                e.target.value = '';
            }, []);

            const clearImages = useCallback((type, groupId) => {
                setGroups(prev => prev.map(g => {
                    if (g.id !== groupId) return g;
                    if (type === 'clothing') return { ...g, clothingImages: [] };
                    return { ...g, modelImages: [] };
                }));
            }, []);

            const removeImage = useCallback((type, id, groupId) => {
                setGroups(prev => prev.map(g => {
                    if (g.id !== groupId) return g;
                    if (type === 'clothing') return { ...g, clothingImages: g.clothingImages.filter(i => i.id !== id) };
                    return { ...g, modelImages: g.modelImages.filter(i => i.id !== id) };
                }));
            }, []);

            const updateImageUrl = useCallback((type, id, newUrl, groupId) => {
                setGroups(prev => prev.map(g => {
                    if (g.id !== groupId) return g;
                    const updater = (list) => list.map(img => img.id === id ? { ...img, url: newUrl } : img);
                    if (type === 'clothing') return { ...g, clothingImages: updater(g.clothingImages) };
                    return { ...g, modelImages: updater(g.modelImages) };
                }));
            }, []);

            const reorderImages = useCallback((type, fromId, toId, groupId) => {
                const reorder = (list) => {
                    const fromIndex = list.findIndex(i => i.id === fromId);
                    const toIndex = list.findIndex(i => i.id === toId);
                    if (fromIndex < 0 || toIndex < 0 || fromIndex === toIndex) return list;
                    const next = list.slice();
                    const [moved] = next.splice(fromIndex, 1);
                    next.splice(toIndex, 0, moved);
                    return next;
                };
                setGroups(prev => prev.map(g => {
                    if (g.id !== groupId) return g;
                    if (type === 'clothing') return { ...g, clothingImages: reorder(g.clothingImages) };
                    return { ...g, modelImages: reorder(g.modelImages) };
                }));
            }, []);

            const reorderImagesByIndex = useCallback((type, fromIndex, toIndex, groupId) => {
                const reorder = (list) => {
                    if (fromIndex < 0 || toIndex < 0 || fromIndex === toIndex) return list;
                    const next = list.slice();
                    const [moved] = next.splice(fromIndex, 1);
                    const insertIndex = fromIndex < toIndex ? toIndex - 1 : toIndex;
                    next.splice(insertIndex, 0, moved);
                    return next;
                };
                setGroups(prev => prev.map(g => {
                    if (g.id !== groupId) return g;
                    if (type === 'clothing') return { ...g, clothingImages: reorder(g.clothingImages) };
                    return { ...g, modelImages: reorder(g.modelImages) };
                }));
            }, []);

            // ========== 服务器连接测试 ==========
            const testServerConnection = useCallback(async () => {
                try {
                    const response = await fetch(`${settings.serverUrl}/api/health`, {
                        method: 'GET',
                        signal: AbortSignal.timeout(5000),
                    });
                    setServerStatus(response.ok ? 'connected' : 'error');
                } catch (e) {
                    setServerStatus('error');
                }
            }, [settings.serverUrl]);

            // ========== 保存图片到服务器 ==========
            const saveImageToServer = useCallback(async (imageUrl, filename) => {
                if (!settings.autoSave || settings.saveMode !== 'server' || !settings.serverUrl) return { success: false };
                try {
                    const blob = await getBlobFromUrl(imageUrl);
                    const formData = new FormData();
                    formData.append('image', blob, filename);
                    const subfolder = sanitizeSubfolder(settings.subfolder);
                    if (subfolder) formData.append('subfolder', subfolder);
                    const response = await fetch(`${settings.serverUrl}/api/save-image`, {
                        method: 'POST',
                        body: formData,
                        signal: AbortSignal.timeout(30000),
                    });
                    return { success: response.ok };
                } catch (e) {
                    return { success: false, error: e.message };
                }
            }, [settings.autoSave, settings.saveMode, settings.serverUrl, settings.subfolder]);

            // ========== 保存图片到本地文件夹 ==========
            const saveImageToLocalFolder = useCallback(async (imageUrl, filename) => {
                if (!settings.autoSave || settings.saveMode !== 'local') return { success: false };
                if (!localDirHandle) return { success: false, error: '未选择保存文件夹' };
                try {
                    const hasPerm = await ensureLocalDirPermission();
                    if (!hasPerm) return { success: false, error: '未授权写入权限' };
                    const blob = await getBlobFromUrl(imageUrl);
                    const fileHandle = await localDirHandle.getFileHandle(filename, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    return { success: true };
                } catch (e) {
                    return { success: false, error: e.message };
                }
            }, [settings.autoSave, settings.saveMode, localDirHandle, ensureLocalDirPermission]);

            const addToGallery = useCallback(async (imageUrl, filename, clothingImg, modelImg) => {
                try {
                    const dataUrl = imageUrl.startsWith('data:') ? imageUrl : await blobToDataURL(await getBlobFromUrl(imageUrl));
                    const id = generateId();
                    const dbKey = `gallery_${id}`;
                    await saveImageToDB(dbKey, dataUrl);
                    const clothingDbKey = clothingImg?.url?.startsWith('data:') ? `gallery_src_c_${id}` : null;
                    const modelDbKey = modelImg?.url?.startsWith('data:') ? `gallery_src_m_${id}` : null;
                    if (clothingDbKey) await saveImageToDB(clothingDbKey, clothingImg.url);
                    if (modelDbKey) await saveImageToDB(modelDbKey, modelImg.url);
                    setGalleryItems(prev => [{
                        id,
                        name: filename,
                        createdAt: Date.now(),
                        dbKey,
                        url: dataUrl,
                        clothingName: clothingImg?.name || '',
                        modelName: modelImg?.name || '',
                        clothingDbKey,
                        modelDbKey,
                        clothingUrl: clothingImg?.url || '',
                        modelUrl: modelImg?.url || '',
                    }, ...prev]);
                } catch (e) { /* ignore */ }
            }, []);

            const downloadGalleryItems = useCallback(async (items) => {
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    try {
                        const blob = await getBlobFromUrl(item.url);
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = item.name || `gallery_${i + 1}_${Date.now()}.jpg`;
                        a.click();
                        URL.revokeObjectURL(url);
                        await new Promise(r => setTimeout(r, DOWNLOAD_DELAY_MS));
                    } catch (e) { /* ignore */ }
                }
            }, []);

            const regenSingle = useCallback(async (clothingUrl, modelUrl, clothingName, modelName) => {
                if (!clothingUrl || !modelUrl) {
                    alert('缺少源图，无法重新生成');
                    return;
                }
                const task = {
                    id: generateId(),
                    clothingImg: { id: generateId(), url: clothingUrl, name: clothingName || 'clothing' },
                    modelImg: { id: generateId(), url: modelUrl, name: modelName || 'model' },
                    status: 'pending',
                    progress: 0,
                    resultUrl: null,
                    error: null,
                    saved: false,
                };

                dispatch({ type: 'SET_TASKS', tasks: [...tasks, task] });
                setIsRunning(true);

                if (!abortControllerRef.current || abortControllerRef.current.signal.aborted) {
                    abortControllerRef.current = new AbortController();
                }
                if (!semaphoreRef.current) {
                    semaphoreRef.current = new Semaphore(settings.concurrency);
                }
                const signal = abortControllerRef.current.signal;

                await semaphoreRef.current.acquire();
                try {
                    if (!signal.aborted) await processTask(task, signal);
                } finally {
                    semaphoreRef.current.release();
                }
                setIsRunning(false);
            }, [tasks, settings.concurrency, processTask]);

            // ========== 自动下载到本地 ==========
            const autoDownloadImage = useCallback(async (imageUrl, filename) => {
                if (!settings.autoSave || settings.saveMode !== 'download' || !settings.autoDownload) return { success: false };
                try {
                    const blob = await getBlobFromUrl(imageUrl);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(url);
                    return { success: true };
                } catch (e) {
                    return { success: false, error: e.message };
                }
            }, [settings.autoSave, settings.saveMode, settings.autoDownload]);

            // ========== API调用函数 ==========
            const callTryonAPI = useCallback(async (clothingImg, modelImg, signal) => {
                const clothingDataUrl = await convertToJpgDataUrl(clothingImg.url);
                const modelDataUrl = await convertToJpgDataUrl(modelImg.url);
                if (!clothingDataUrl || !modelDataUrl) {
                    throw new Error('图片转换失败');
                }

                const clothingBlob = await fetch(clothingDataUrl).then(r => r.blob());
                const modelBlob = await fetch(modelDataUrl).then(r => r.blob());

                const buildFormData = (imageField) => {
                    const fd = new FormData();
                    fd.append(imageField, clothingBlob, 'clothing.jpg');
                    fd.append(imageField, modelBlob, 'model.jpg');
                    fd.append('model', settings.model || 'nano-banana-2');
                    fd.append('prompt', settings.prompt);
                    if (settings.responseFormat) fd.append('response_format', settings.responseFormat);
                    if (settings.aspectRatio) fd.append('aspect_ratio', settings.aspectRatio);
                    if (settings.imageSize) fd.append('image_size', settings.imageSize);
                    return fd;
                };

                const requestOnce = async (imageField) => {
                    const response = await fetch(`${settings.baseUrl}/v1/images/edits`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${settings.apiKey}` },
                        body: buildFormData(imageField),
                        signal,
                    });
                    return response;
                };

                let response = await requestOnce('image');
                if (!response.ok && (response.status === 400 || response.status === 422)) {
                    const errText = await response.text().catch(() => '');
                    response = await requestOnce('image[]');
                    if (!response.ok) {
                        const retryErr = await response.text().catch(() => '');
                        throw new Error(`API错误: ${response.status} ${retryErr || errText}`);
                    }
                } else if (!response.ok) {
                    const errText = await response.text().catch(() => '');
                    throw new Error(`API错误: ${response.status} ${errText}`);
                }

                const data = await response.json().catch(() => ({}));
                const imageUrl = deepSearchForUrl(data);
                if (imageUrl) return imageUrl;
                const b64 = data?.data?.[0]?.b64_json;
                if (b64) return `data:image/png;base64,${b64}`;
                throw new Error('未找到结果图片URL');
            }, [settings.baseUrl, settings.prompt, settings.model, settings.responseFormat, settings.aspectRatio, settings.imageSize, settings.apiKey]);

            // ========== 处理单个任务 ==========
            const processTask = useCallback(async (task, signal) => {
                dispatch({ type: 'UPDATE_TASK', id: task.id, updates: { status: 'processing', progress: 30 } });
                try {
                    const resultUrl = await callTryonAPI(task.clothingImg, task.modelImg, signal);

                    let saved = false;
                    if (settings.autoSave) {
                        const filename = `tryon_${task.clothingImg.name}_${task.modelImg.name}_${Date.now()}.jpg`;
                        if (settings.saveMode === 'server') {
                            const saveResult = await saveImageToServer(resultUrl, filename);
                            saved = saveResult.success;
                        } else if (settings.saveMode === 'local') {
                            const saveResult = await saveImageToLocalFolder(resultUrl, filename);
                            saved = saveResult.success;
                        } else if (settings.saveMode === 'download') {
                            const saveResult = await autoDownloadImage(resultUrl, filename);
                            saved = saveResult.success;
                        }
                    }

                    dispatch({
                        type: 'UPDATE_TASK', id: task.id, updates: {
                            status: 'completed', progress: 100, resultUrl, saved
                        }
                    });

                    addToGallery(resultUrl, `tryon_${task.clothingImg.name}_${task.modelImg.name}_${Date.now()}.jpg`, task.clothingImg, task.modelImg);

                    if (settings.previewCompress) {
                        const maxSize = Number(settings.previewMaxSize) || 768;
                        const quality = Number(settings.previewQuality) || 0.7;
                        compressImageForPreview(resultUrl, maxSize, quality)
                            .then(previewUrl => {
                                if (previewUrl) {
                                    dispatch({ type: 'UPDATE_TASK', id: task.id, updates: { previewUrl } });
                                }
                            });
                    }
                } catch (e) {
                    if (e.message !== '已取消') {
                        dispatch({
                            type: 'UPDATE_TASK', id: task.id, updates: {
                                status: 'failed', error: e.message
                            }
                        });
                    }
                }
            }, [callTryonAPI, saveImageToServer, saveImageToLocalFolder, autoDownloadImage, addToGallery, settings.autoSave, settings.saveMode, settings.previewCompress, settings.previewMaxSize, settings.previewQuality]);

            // ========== 开始批量处理 ==========
            const buildTasksForGroup = useCallback((group) => {
                const { clothingImages: c, modelImages: m } = group;
                if (settings.pairingMode === 'fixedModel') {
                    return c.map((clothing) => ({
                        id: generateId(),
                        clothingImg: clothing,
                        modelImg: m[0],
                        status: 'pending',
                        progress: 0,
                        resultUrl: null,
                        error: null,
                        saved: false,
                    }));
                }
                if (settings.pairingMode === 'fixedClothing') {
                    return m.map((model) => ({
                        id: generateId(),
                        clothingImg: c[0],
                        modelImg: model,
                        status: 'pending',
                        progress: 0,
                        resultUrl: null,
                        error: null,
                        saved: false,
                    }));
                }
                return c.map((clothing, i) => ({
                    id: generateId(),
                    clothingImg: clothing,
                    modelImg: m[i],
                    status: 'pending',
                    progress: 0,
                    resultUrl: null,
                    error: null,
                    saved: false,
                }));
            }, [settings.pairingMode]);

            const validateGroup = useCallback((group) => {
                const c = group.clothingImages.length;
                const m = group.modelImages.length;
                if (c === 0 || m === 0) return '请先添加服装和模特图片';
                if (settings.pairingMode === 'pair' && c !== m) return '服装和模特图片数量必须相同';
                if (settings.pairingMode === 'fixedModel' && m < 1) return '固定模特模式需要至少1张模特图';
                if (settings.pairingMode === 'fixedClothing' && c < 1) return '固定服装模式需要至少1张服装图';
                return null;
            }, [settings.pairingMode]);

            const startBatch = useCallback(async (groupId = null) => {
                if (!settings.apiKey) {
                    alert('请输入API Key');
                    return;
                }
                if (settings.autoSave && settings.saveMode === 'local' && !localDirHandle) {
                    alert('请先选择保存文件夹');
                    return;
                }

                const targetGroups = groupId ? groups.filter(g => g.id === groupId) : groups;
                const errors = [];
                targetGroups.forEach((g, idx) => {
                    const err = validateGroup(g);
                    if (err) errors.push(`${g.name || `分组${idx + 1}`}：${err}`);
                });
                if (errors.length > 0) {
                    alert(errors.join('\n'));
                    return;
                }

                const newTasks = targetGroups.flatMap(g => buildTasksForGroup(g));

                dispatch({ type: 'SET_TASKS', tasks: newTasks });
                setIsRunning(true);

                abortControllerRef.current = new AbortController();
                semaphoreRef.current = new Semaphore(settings.concurrency);
                const signal = abortControllerRef.current.signal;

                const promises = newTasks.map(task =>
                    semaphoreRef.current.acquire().then(async () => {
                        try {
                            if (!signal.aborted) {
                                await processTask(task, signal);
                            }
                        } finally {
                            semaphoreRef.current.release();
                        }
                    })
                );

                await Promise.allSettled(promises);
                setIsRunning(false);
            }, [groups, settings.apiKey, settings.concurrency, settings.autoSave, settings.saveMode, localDirHandle, buildTasksForGroup, validateGroup, processTask]);

            // ========== 停止批量处理 ==========
            const stopBatch = useCallback(() => {
                if (abortControllerRef.current) {
                    abortControllerRef.current.abort();
                }
                setIsRunning(false);
            }, []);

            // ========== 重试失败任务 ==========
            const retryFailed = useCallback(async () => {
                const failedTasks = tasks.filter(t => t.status === 'failed');
                if (failedTasks.length === 0) return;

                failedTasks.forEach(t => {
                    dispatch({ type: 'UPDATE_TASK', id: t.id, updates: { status: 'pending', progress: 0, error: null } });
                });

                setIsRunning(true);
                abortControllerRef.current = new AbortController();
                semaphoreRef.current = new Semaphore(settings.concurrency);
                const signal = abortControllerRef.current.signal;

                const promises = failedTasks.map(task =>
                    semaphoreRef.current.acquire().then(async () => {
                        try {
                            if (!signal.aborted) await processTask(task, signal);
                        } finally {
                            semaphoreRef.current.release();
                        }
                    })
                );

                await Promise.allSettled(promises);
                setIsRunning(false);
            }, [tasks, settings.concurrency, processTask]);

            // ========== 统计计算 ==========
            const stats = useMemo(() => {
                const pending = tasks.filter(t => t.status === 'pending').length;
                const processing = tasks.filter(t => t.status === 'processing').length;
                const completed = tasks.filter(t => t.status === 'completed').length;
                const failed = tasks.filter(t => t.status === 'failed').length;
                const total = tasks.length;
                const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
                const running = processing;
                const queue = pending;
                return { pending, processing, completed, failed, total, percent, running, queue };
            }, [tasks]);

            // ========== 下载所有结果 ==========
            const downloadAll = useCallback(async () => {
                const completedTasks = tasks.filter(t => t.status === 'completed' && t.resultUrl);
                for (let i = 0; i < completedTasks.length; i++) {
                    const task = completedTasks[i];
                    try {
                        const blob = await getBlobFromUrl(task.resultUrl);
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `tryon_${i + 1}_${Date.now()}.jpg`;
                        a.click();
                        URL.revokeObjectURL(url);
                        await new Promise(r => setTimeout(r, DOWNLOAD_DELAY_MS));
                    } catch (e) { /* ignore */ }
                }
            }, [tasks]);

            // ========== 图片拖放区域组件 ==========
            const moveImageBetweenGroups = useCallback((type, fromGroupId, toGroupId, fromId, toIndex = null) => {
                setGroups(prev => {
                    const next = prev.map(g => ({ ...g }));
                    const fromGroup = next.find(g => g.id === fromGroupId);
                    const toGroup = next.find(g => g.id === toGroupId);
                    if (!fromGroup || !toGroup) return prev;
                    const fromList = type === 'clothing' ? fromGroup.clothingImages : fromGroup.modelImages;
                    const toList = type === 'clothing' ? toGroup.clothingImages : toGroup.modelImages;
                    const fromIndex = fromList.findIndex(i => i.id === fromId);
                    if (fromIndex < 0) return prev;
                    const [moved] = fromList.splice(fromIndex, 1);
                    if (typeof toIndex === 'number' && toIndex >= 0) toList.splice(toIndex, 0, moved);
                    else toList.push(moved);
                    if (type === 'clothing') {
                        fromGroup.clothingImages = fromList;
                        toGroup.clothingImages = toList;
                    } else {
                        fromGroup.modelImages = fromList;
                        toGroup.modelImages = toList;
                    }
                    return next;
                });
            }, []);

            const addGroup = useCallback(() => {
                setGroups(prev => [{ id: generateId(), name: `分组${prev.length + 1}`, clothingImages: [], modelImages: [], collapsed: false }, ...prev]);
            }, []);

            const removeGroup = useCallback((groupId) => {
                setGroups(prev => prev.length <= 1 ? prev : prev.filter(g => g.id !== groupId));
            }, []);

            const moveGroup = useCallback((groupId, direction) => {
                setGroups(prev => {
                    const index = prev.findIndex(g => g.id === groupId);
                    if (index < 0) return prev;
                    const next = prev.slice();
                    const target = direction === 'up' ? index - 1 : index + 1;
                    if (target < 0 || target >= next.length) return prev;
                    const [moved] = next.splice(index, 1);
                    next.splice(target, 0, moved);
                    return next;
                });
            }, []);

            const toggleGroupCollapse = useCallback((groupId) => {
                setGroups(prev => prev.map(g => g.id === groupId ? { ...g, collapsed: !g.collapsed } : g));
            }, []);

            const renameGroup = useCallback((groupId, name) => {
                setGroups(prev => prev.map(g => g.id === groupId ? { ...g, name } : g));
            }, []);

            const ImageDropZone = ({ type, images, title, groupId }) => (
                <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between mb-3 px-1">
                        <span className="text-zinc-800 text-xs font-bold tracking-widest ">{title} <span className="text-zinc-500">({images.length})</span></span>
                        {images.length > 0 && (
                            <button onClick={() => clearImages(type, groupId)}
                                className="text-xs font-bold text-zinc-800 border-b-2 border-zinc-200 hover:bg-zinc-800 hover:text-white transition-colors flex items-center gap-1 group px-1">
                                <Icon name="x" size={12} className="group-hover:rotate-90 transition-transform" />
                                CLEAR
                            </button>
                        )}
                    </div>
                    <div className="drop-zone p-4 min-h-[140px] flex flex-col justify-center"
                        onDragOver={e => { e.preventDefault(); e.currentTarget.classList.add('dragover'); }}
                        onDragLeave={e => e.currentTarget.classList.remove('dragover')}
                        onDrop={e => {
                            const payload = e.dataTransfer.getData('application/json');
                            if (payload) {
                                try {
                                    const data = JSON.parse(payload);
                                    if (data.type === type && data.groupId) {
                                        if (data.groupId === groupId) {
                                            if (typeof data.index === 'number') {
                                                reorderImagesByIndex(type, data.index, images.length, groupId);
                                            }
                                        } else {
                                            moveImageBetweenGroups(type, data.groupId, groupId, data.id, images.length);
                                        }
                                        e.currentTarget.classList.remove('dragover');
                                        return;
                                    }
                                } catch (err) { /* ignore */ }
                            }
                            handleFileDrop(e, type, groupId);
                        }}>
                        {images.length === 0 ? (
                            <label className="flex flex-col items-center justify-center py-8 cursor-pointer group">
                                <div className="p-4 bg-white border border-dashed border-zinc-200 group-hover:bg-primary-500 group-hover:border-solid transition-colors mb-3 shadow-[4px_4px_0px_0px_#000]">
                                    <Icon name="upload" size={24} className="text-zinc-800 transition-colors" />
                                </div>
                                <span className="text-sm font-bold text-zinc-800  group-hover:underline">Drop or Click to Upload</span>
                                <span className="text-xs text-zinc-500 mt-1 font-mono">JPG, PNG, WEBP</span>
                                <input type="file" multiple accept="image/*" className="hidden"
                                    onChange={e => handleFileSelect(e, type, groupId)} />
                            </label>
                        ) : (
                            <div className="grid grid-cols-4 sm:grid-cols-5 gap-3">
                                {images.map((img, idx) => (
                                    <div
                                        key={img.id}
                                        className={`relative group/item aspect-square bg-white border border-zinc-200 hover:bg-yellow-100 transition-all ${dragOverId === img.id && dragOverType === type
                                            ? 'border-primary-500 scale-[1.05] z-10 shadow-hard'
                                            : 'shadow-sm hover:shadow-hard hover:-translate-y-1 hover:-translate-x-1'
                                            }`}
                                        draggable
                                        onDragStart={(e) => {
                                            e.dataTransfer.setData('text/plain', img.id);
                                            e.dataTransfer.setData('application/json', JSON.stringify({ id: img.id, type, groupId, index: idx }));
                                            e.dataTransfer.effectAllowed = 'move';
                                        }}
                                        onDragEnter={() => { setDragOverId(img.id); setDragOverType(type); }}
                                        onDragOver={(e) => {
                                            e.preventDefault();
                                            e.dataTransfer.dropEffect = 'move';
                                            if (dragOverId !== img.id || dragOverType !== type) {
                                                setDragOverId(img.id); setDragOverType(type);
                                            }
                                        }}
                                        onDrop={(e) => {
                                            e.preventDefault();
                                            const payload = e.dataTransfer.getData('application/json');
                                            if (payload) {
                                                try {
                                                    const data = JSON.parse(payload);
                                                    if (data.type === type) {
                                                        if (data.groupId === groupId) {
                                                            if (typeof data.index === 'number' && data.index !== idx) {
                                                                reorderImagesByIndex(type, data.index, idx, groupId);
                                                            }
                                                        } else {
                                                            moveImageBetweenGroups(type, data.groupId, groupId, data.id, idx);
                                                        }
                                                    }
                                                } catch (err) { /* ignore */ }
                                            }
                                            setDragOverId('');
                                            setDragOverType('');
                                        }}
                                        onDragEnd={() => {
                                            setDragOverId('');
                                            setDragOverType('');
                                        }}
                                        onDragLeave={() => {
                                            if (dragOverId === img.id && dragOverType === type) {
                                                setDragOverId('');
                                                setDragOverType('');
                                            }
                                        }}
                                        title="Drag to reorder"
                                    >
                                        <img src={img.url} className="w-full h-full object-cover transition-transform group-hover/item:scale-110 duration-500" />

                                        <div className="absolute inset-x-0 bottom-0 p-2 bg-gradient-to-t from-black/80 via-black/40 to-transparent opacity-0 group-hover/item:opacity-100 transition-opacity flex justify-between items-end translate-y-2 group-hover/item:translate-y-0 duration-300">
                                            <div className="text-[10px] bg-white/20 backdrop-blur-md px-1.5 rounded text-white font-medium">{idx + 1}</div>
                                            <div className="flex gap-1">
                                                <button
                                                    onClick={() => setCropState({ open: true, type, id: img.id, src: img.url, groupId })}
                                                    className="p-1.5 bg-white/10 hover:bg-primary-500 rounded-md text-white backdrop-blur-md transition-colors"
                                                    title="Crop"
                                                >
                                                    <Icon name="crop" size={12} />
                                                </button>
                                                <button
                                                    onClick={() => removeImage(type, img.id, groupId)}
                                                    className="p-1.5 bg-white/10 hover:bg-red-500 rounded-md text-white backdrop-blur-md transition-colors"
                                                    title="Remove"
                                                >
                                                    <Icon name="x" size={12} />
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                <label
                                    className="aspect-square border border-white/5 bg-white/5 hover:bg-white/10 rounded-lg flex items-center justify-center cursor-pointer transition-all hover:scale-105 active:scale-95"
                                    onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }}
                                    onDrop={(e) => {
                                        e.preventDefault();
                                        const payload = e.dataTransfer.getData('application/json');
                                        if (payload) {
                                            try {
                                                const data = JSON.parse(payload);
                                                if (data.type === type && data.groupId) {
                                                    if (data.groupId === groupId) {
                                                        if (typeof data.index === 'number') {
                                                            reorderImagesByIndex(type, data.index, images.length, groupId);
                                                        }
                                                    } else {
                                                        moveImageBetweenGroups(type, data.groupId, groupId, data.id, images.length);
                                                    }
                                                }
                                            } catch (err) { /* ignore */ }
                                        }
                                    }}
                                >
                                    <Icon name="plus" size={20} className="text-zinc-500 hover:text-white transition-colors" />
                                    <input type="file" multiple accept="image/*" className="hidden"
                                        onChange={e => handleFileSelect(e, type, groupId)} />
                                </label>
                            </div>
                        )}
                    </div>
                </div>
            );

            // ========== 任务卡片组件 ==========
            const TaskCard = ({ task, index }) => {
                const statusConfig = {
                    pending: { color: 'bg-zinc-200 border-zinc-200', text: 'QUEUE', icon: 'square' },
                    processing: { color: 'bg-yellow-400 border-zinc-200', text: 'BUSY', icon: 'play' },
                    completed: { color: 'bg-green-400 border-zinc-200', text: 'DONE', icon: 'check' },
                    failed: { color: 'bg-red-400 border-zinc-200', text: 'FAIL', icon: 'alert-circle' }
                };
                const config = statusConfig[task.status] || statusConfig.pending;
                const displayUrl = task.previewUrl || task.resultUrl;

                return (
                    <div className="soft-card bg-white p-3 relative group transition-all duration-300 hover:-translate-y-1 hover:shadow-lg">
                        <div className="flex justify-between items-center mb-2">

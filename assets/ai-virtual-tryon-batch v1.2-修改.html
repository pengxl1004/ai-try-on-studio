                                                            <div className="flex gap-4 mt-6 pt-6 border-t-2 border-zinc-200">
                                                                <button onClick={downloadAll}
                                                                    className="px-5 py-2.5 bg-black text-white hover:bg-zinc-800 border border-zinc-200 text-sm font-bold  transition-colors flex items-center gap-2 shadow-sm active:shadow-none active:translate-x-[2px] active:translate-y-[2px]">
                                                                    <Icon name="download" size={16} />
                                                                    Download All ({stats.completed})
                                                                </button>
                                                                {stats.failed > 0 && (
                                                                    <button onClick={retryFailed}
                                                                        className="px-5 py-2.5 bg-red-500 hover:bg-red-400 border border-zinc-200 text-zinc-800 text-sm font-bold  transition-colors flex items-center gap-2 shadow-sm active:shadow-none active:translate-x-[2px] active:translate-y-[2px]">
                                                                        <Icon name="refresh-cw" size={16} />
                                                                        Retry Failed ({stats.failed})
                                                                    </button>
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </main>
                                        )}

                                    {activeTab === 'gallery' && (
                                        <div className="soft-card bg-white p-6 min-h-[500px] animate-fade-in border border-zinc-200 shadow-lg">
                                            <div className="flex items-center justify-between mb-8">
                                                <h2 className="text-2xl font-bold text-zinc-800 flex items-center gap-2   ">
                                                    <Icon name="grid" size={24} className="text-zinc-800" />
                                                    Gallery ({galleryItems.length})
                                                </h2>
                                                <div className="flex bg-zinc-100 p-1 border border-zinc-200 shadow-sm">
                                                    <button className="px-3 py-1.5 text-xs font-bold text-white bg-black border border-zinc-200 shadow-sm -translate-y-0.5 -translate-x-0.5">GRID</button>
                                                    <button className="px-3 py-1.5 text-xs font-bold text-zinc-500 hover:text-zinc-800 transition-colors">LIST</button>
                                                </div>
                                            </div>

                                            <div className="flex flex-wrap items-center gap-3 mb-6 p-4 bg-zinc-100 border border-zinc-200 shadow-sm">
                                                <span className="text-xs font-bold text-zinc-800  tracking-wider mr-2">Actions</span>
                                                <button onClick={() => setGallerySelected(new Set(galleryItems.map(i => i.id)))}
                                                    className="px-3 py-1.5 bg-white hover:bg-zinc-50 border border-zinc-200 text-xs font-bold  text-zinc-800 transition-colors shadow-sm active:shadow-none active:translate-x-[1px] active:translate-y-[1px]">
                                                    Select All
                                                </button>
                                                <button onClick={() => setGallerySelected(new Set())}
                                                    className="px-3 py-1.5 bg-white hover:bg-zinc-50 border border-zinc-200 text-xs font-bold  text-zinc-500 hover:text-zinc-800 transition-colors shadow-sm active:shadow-none active:translate-x-[1px] active:translate-y-[1px]">
                                                    Deselect
                                                </button>
                                                <div className="h-6 w-0.5 bg-black mx-2" />
                                                <button onClick={() => downloadGalleryItems(galleryItems.filter(i => gallerySelected.has(i.id)))}
                                                    disabled={gallerySelected.size === 0}
                                                    className="px-3 py-1.5 bg-primary-500 hover:bg-primary-400 border border-zinc-200 text-xs font-bold  text-white transition-colors disabled:opacity-50 disabled:bg-zinc-300 shadow-sm active:shadow-none active:translate-x-[1px] active:translate-y-[1px]">
                                                    Download Selected
                                                </button>
                                                <button onClick={() => {
                                                    const items = galleryItems.filter(i => gallerySelected.has(i.id));
                                                    items.forEach(i => regenSingle(i.clothingUrl, i.modelUrl, i.clothingName, i.modelName));
                                                }}
                                                    disabled={gallerySelected.size === 0}
                                                    className="px-3 py-1.5 bg-black hover:bg-zinc-800 border border-zinc-200 text-xs font-bold  text-white transition-colors disabled:opacity-50 shadow-sm active:shadow-none active:translate-x-[1px] active:translate-y-[1px]">
                                                    Regenerate Selected
                                                </button>
                                            </div>

                                            {galleryItems.length === 0 ? (
                                                <div className="flex flex-col items-center justify-center py-20 text-zinc-800 border border-dashed border-zinc-200 bg-zinc-50">
                                                    <Icon name="image" size={48} className="mb-4 opacity-20" />
                                                    <p className="font-bold ">No images in gallery yet.</p>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-8 gap-4">
                                                    {galleryItems.map((item, idx) => (
                                                        <div key={item.id} className="relative group aspect-[3/4] border border-zinc-200 bg-zinc-100 overflow-hidden cursor-pointer shadow-sm hover:shadow-hard-md transition-all hover:-translate-y-1"
                                                            onClick={() => {
                                                                const next = new Set(gallerySelected);
                                                                if (next.has(item.id)) next.delete(item.id);
                                                                else next.add(item.id);
                                                                setGallerySelected(next);
                                                            }}>
                                                            <img src={item.url} loading="lazy" className="w-full h-full object-cover transition-transform duration-500" />
                                                            <div className={`absolute inset-0 bg-white/80 transition-opacity duration-200 border-4 border-primary-500 ${gallerySelected.has(item.id) ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}>
                                                                <div className="absolute top-2 left-2">
                                                                    <div className={`w-5 h-5 border border-zinc-200 ${gallerySelected.has(item.id) ? 'bg-primary-500' : 'bg-white'}`}>
                                                                        {gallerySelected.has(item.id) && <Icon name="check" size={16} className="text-zinc-800" />}
                                                                    </div>
                                                                </div>
                                                                <div className="absolute bottom-0 inset-x-0 p-3 flex justify-center gap-2 items-center h-full">
                                                                    <button onClick={(e) => { e.stopPropagation(); setPreviewModalUrl(item.url); }} className="p-2 bg-black text-white border border-zinc-200 shadow-sm hover:scale-110 transition-transform">
                                                                        <Icon name="eye" size={20} />
                                                                    </button>
                                                                    <button onClick={(e) => { e.stopPropagation(); regenSingle(item.clothingUrl, item.modelUrl, item.clothingName, item.modelName); }} className="p-2 bg-primary-500 text-white border border-zinc-200 shadow-sm hover:scale-110 transition-transform">
                                                                        <Icon name="refresh-cw" size={20} />
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    <footer className="text-center text-zinc-800 font-bold text-xs py-8 border-t-2 border-zinc-200 mt-8">
                                        <p>© 2024 BOOM AI Virtual Try-on • Powered by Flux Model & Soft Minimal</p>
                                    </footer>
                                </div >
                            </div >
                        );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
